name: Agentic QA Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Browsers & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: 🧪 Run Pytest Automated Verification Suite
        run: |
          pytest tests/ -v

      - name: 📊 Execute Multi-Model Academic Benchmark & Generate Report
        run: |
          python generate_report.py --doc 2008_keepass

      - name: 📤 Upload Evaluation Reports as CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: academic-evaluation-report
          path: |
            data/Evaluation_Report.md
            data/Evaluation_Report.html
            logs/
